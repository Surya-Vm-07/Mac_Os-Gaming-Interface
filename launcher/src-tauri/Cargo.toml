[package]
name = "aether-launcher"
description = "Aether Launcher — a $0 Windows game launcher for Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# _lib suffix avoids a name clash with the bin target on Windows/Cargo.
name = "aether_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aether-engine = { path = "../crates/aether-engine" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
dirs = "6"
